/* ================= Level 6: the slingshot (how hard and how high to fling something so it lands where you want) ================= */
function Sling() {

  const DEF = [{ x: 570, y: 700 }, { x: 860, y: 700 }, { x: 740, y: 440, ledge: 1 }, { x: 810, y: 700, wall: { x: 500, h: 230 } }, { x: 830, y: 410, ledge: 1, wall: { x: 500, h: 150 } }];

  function setPull(p) { let dx = P0.x - p.x, dy = P0.y - p.y; const l = Math.hypot(dx, dy); if (l > MAXP) { dx *= MAXP / l; dy *= MAXP / l; } sc.pull = { dx, dy }; }

      for (let t = 0; t < 3; t += .004) { vy += GR * .004; x += vx * .004; y += vy * .004; if (dist(x, y, m.x, m.y) < 18) return { dx, dy }; if (solid(x, y)) break; }
    }

    for (let k = 0; k < 5; k++) parts.push({ x: m.x + (Math.random() - .5) * 60, y: m.y - 60, vx: (Math.random() - .5) * 80, vy: -90 - Math.random() * 60, g: -20, life: 1.2, t: 0, r: 9, col: '#ff6b8f', rot: 0, k: 'h' });

    g.beginPath(); g.moveTo(P0.x - 32, P0.y - 6); g.quadraticCurveTo(P0.x - 30, 560, P0.x, 574); g.quadraticCurveTo(P0.x + 30, 560, P0.x + 32, P0.y - 6); g.strokeStyle = J.wood2; g.lineWidth = 22; g.lineJoin = 'round'; g.stroke(); g.strokeStyle = J.wood; g.lineWidth = 13; g.stroke();

  };

}

/* ================= story scenes: intro, the nest between levels (and the hatching), the party ================= */
function bunting() {

  for (let i = 0; i < 13; i++) { const u = (i + .5) / 13, x = VIEW.x + VIEW.w * u, y = 96 + 148 * u * (1 - u); g.beginPath(); g.moveTo(x - 20, y); g.lineTo(x + 20, y); g.lineTo(x, y + 36); g.closePath(); g.fillStyle = CONF[i % CONF.length]; g.fill(); }
}

    for (const [lx, r] of [[384, 2.6], [640, .5]]) leafShape(lx, 104, 54, 17, r);

}
function Award(n) {

    leaves: n > 2 ? 1 : 0, bush: 0, notes: 0, dhop: 0, btn: false, taps: 0, z: null, ztalk: false };

    else if (n === 2) { sfx.rustle(); await tw(sc, { leaves: 1 }, .6, 'out'); }

function Finale() {
  const BX = [350, 458, 566, 674], BY = 712, RP = { x: 952, y: 66, r: 40 }, ZX = 590, ZY = 640, ZS = 1.4;
  const sc = { name: 'fin', hop: 0, dhop: 0, dance: 0, vi: 0, ztalk: false, conf: 0, berry: null, open: 0 };
  sc.enter = async () => { LI = 7; burst(512, 240, 60, { v: 480 }); sfx.win(); instr = V.fin; await sayAll(V.fin); };
  async function talk(i) { sc.ztalk = true; sfx.chirp(); await say(ZV[i]); sc.ztalk = false; }
  const jump = (k, h) => tw(sc, { [k]: h }, .2, 'out').then(() => tw(sc, { [k]: 0 }, .25, 'in'));
  const act = [
    () => { sc.dance = 4.2; sfx.tune(); },
    () => { sfx.chirp(); jump('hop', 110); },
    () => { talk(0); jump('hop', 24); },
    async () => {
      if (sc.berry) return; const m = dinoMouth(ZX, ZY, ZS, true), b = sc.berry = { x: 250, y: 520, u: 0 }; sfx.twang(); sc.open = 1;
      await tw(b, { u: 1 }, .6, 'lin'); sc.berry = null; sc.open = 0; sfx.chomp(); burst(m.x, m.y - 40, 6, { k: 'h', col: '#ff6b8f', v: 90, g: -20, life: 1 }); jump('hop', 26); talk(1);
    }
  ];
  sc.act = act;
  sc.down = p => {
    if (dist(p.x, p.y, RP.x, RP.y) < RP.r + 12) { sfx.pop(); goLevel(0); return; }
    for (let i = 0; i < 4; i++) if (dist(p.x, p.y, BX[i], BY) < 52) { sc.hit = { i, t: now }; act[i](); return; }
    if (Math.abs(p.x - ZX) < 140 && p.y > 330 && p.y < 650) { jump('hop', 36); sc.vi = sc.vi === 2 ? 3 : 2; talk(sc.vi); return; }
    if (dist(p.x, p.y, 200, 580) < 100) { sfx.star(); burst(200, 510, 12, { k: 's', col: C.yel, v: 220 }); jump('dhop', 46); return; }
    burst(p.x, p.y, 10); sfx.pop();
  };
  sc.update = dt => {
    sc.dance = Math.max(0, sc.dance - dt);
    if (sc.dance > 0) { sc.conf += dt; if (sc.conf > .12) { sc.conf = 0; burst(VIEW.x + Math.random() * VIEW.w, 60, 2, { v: 60, up: -40, g: 240, life: 2.4 }); } }
  };
  sc.draw = () => {
    drawJungle({ ground: 640 }); bunting();
    drawBush(880, 642, 1.1, 6);
    const d = sc.dance > 0, beat = d ? Math.abs(Math.sin(now * Math.PI * 4)) : 0;
    drawDino(ZX, ZY, ZS, { flip: true, hop: sc.hop + beat * 26, tilt: d ? Math.sin(now * Math.PI * 2) * .1 : 0, arm: d ? .5 + .5 * Math.sin(now * Math.PI * 4) : sc.hop / 40,
      open: sc.ztalk ? .4 + .5 * Math.abs(Math.sin(now * 12)) : sc.open });
    drawDiya(200, 568, 70, { hop: sc.dhop + (d ? beat * 18 : 0), talk: talking && !sc.ztalk, bob: true });
    if (sc.berry) { const b = sc.berry, m = dinoMouth(ZX, ZY, ZS, true); drawBerry(b.x + (m.x - b.x) * b.u, b.y + (m.y - b.y) * b.u - Math.sin(b.u * Math.PI) * 130, 16); }
    for (let i = 0; i < 4; i++) {
      const x = BX[i], hot = sc.hit && sc.hit.i === i && now - sc.hit.t < .15, k = hot ? .9 : 1;
      disc(x, BY + 6, 46 * k, 'rgba(39,48,74,.25)'); disc(x, BY, 46 * k, [C.coral, C.blue, C.yel, '#fff'][i]);
      g.save(); g.translate(x, BY); g.scale(k, k); g.strokeStyle = '#fff'; g.fillStyle = '#fff'; g.lineWidth = 6; g.lineCap = 'round'; g.lineJoin = 'round';
      if (i === 0) { oval(-9, 14, 10, 8, '#fff'); oval(15, 8, 10, 8, '#fff'); g.beginPath(); g.moveTo(0, 14); g.lineTo(0, -18); g.lineTo(24, -24); g.lineTo(24, 8); g.stroke(); }
      else if (i === 1) { g.beginPath(); g.moveTo(0, 22); g.lineTo(0, -16); g.stroke(); g.beginPath(); g.moveTo(-18, -4); g.lineTo(0, -24); g.lineTo(18, -4); g.stroke(); }
      else if (i === 2) { g.fillStyle = C.ink; rr(-24, -20, 48, 34, 12); g.fill(); g.beginPath(); g.moveTo(-10, 12); g.lineTo(-16, 26); g.lineTo(4, 12); g.closePath(); g.fill(); disc(-11, -3, 4, C.yel); disc(0, -3, 4, C.yel); disc(11, -3, 4, C.yel); }
      else drawBerry(0, 4, 22);
      g.restore();
    }
    disc(RP.x, RP.y + 5, RP.r, C.green2); disc(RP.x, RP.y, RP.r, C.green);
    g.beginPath(); g.arc(RP.x, RP.y, 17, -Math.PI * .35, Math.PI * 1.25); g.strokeStyle = '#fff'; g.lineWidth = 6; g.lineCap = 'round'; g.stroke();
    g.beginPath(); g.moveTo(RP.x + 3, RP.y - 26); g.lineTo(RP.x + 20, RP.y - 12); g.lineTo(RP.x + 22, RP.y - 30); g.closePath(); g.fillStyle = '#fff'; g.fill();
  };
  return sc;
}

/* ---------- boot ---------- */
const MAKERS = [Intro, Logs, Vines, Mirrors, Bells, Water, Sling, Finale];
function goLevel(i) { go(MAKERS[i]()); }
function allPhrases() {
  const out = []; const walk = v => { if (typeof v === 'string') out.push(v); else if (Array.isArray(v)) v.forEach(walk); else Object.keys(v).forEach(k => walk(v[k])); };
  walk(V);
  return out.map(t => ({ t, zuzu: false })).concat(ZV.map(t => ({ t, zuzu: true })));
}
window.__phrases = allPhrases; window.__said = said; window.__go = goLevel; window.__cur = () => cur;
window.__pt = (x, y) => ({ x: OX + x * SC, y: OY + y * SC });
window.__state = () => ({ LI, stars: stars.slice(), lock, name: cur && cur.name, r: cur && cur.r });

resize(); go(Intro()); requestAnimationFrame(frame);
