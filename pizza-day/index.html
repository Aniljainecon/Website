<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pizza Day</title>
<meta name="description" content="A no-reading pizza shop for little ones: letters on the sign, dough balls by size, big and little letters, topping orders, more or fewer, fair shares, slices left and pizza deliveries.">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pizza Day">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#7fd3c6">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);margin:0}
[hidden]{display:none!important}
img{max-width:100%}

/* Layout: level dots and stars across the top, one tiled kitchen stage per level, big round answer buttons in a dock below. One bright look, no dark variant. */
:root{
  --wall:#7fd3c6; --wall-line:#6cc2b5; --counter:#eaa95e; --counter-edge:#c98743;
  --ink:#3b2146; --sauce:#d6342a; --cheese:#ffd54a; --crust:#e3a04f;
  --sun:#ffcf3d; --leaf:#4cc36b; --tomato:#e5483b; --white:#fffdf7; --shade:rgba(59,33,70,.2);
  --wood1:#dca061; --wood2:#c4813f; --road:#6b6178; --grass:#8fd46b; --sky:#bfe9ff; --miss:#d4cbdb;
  --font:'Fredoka',ui-rounded,'Arial Rounded MT Bold',system-ui,sans-serif;
  color-scheme:light;
}
html{box-sizing:border-box;height:100%}
body{margin:0;height:100%;box-sizing:border-box;background:var(--wall);color:var(--ink);font-family:var(--font);
  overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
button{font-family:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:4px solid var(--ink);outline-offset:3px}
#app{height:100%;display:flex;flex-direction:column}
#top{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px 12px;padding:10px 0 8px}
#steps{display:flex;gap:clamp(4px,1.1vmin,10px);flex-wrap:wrap}
.dot{width:clamp(30px,5.4vmin,50px);aspect-ratio:1;border-radius:50%;background:var(--white);border:3px solid var(--ink);display:grid;place-items:center;padding:0;box-shadow:0 3px 0 var(--shade);transition:transform .25s,background .25s}
.dot svg{width:68%;height:68%}
.dot.on{background:var(--sun);transform:scale(1.15) translateY(-2px)}
.dot.done{background:var(--leaf)}
.ic{font-family:var(--font);font-weight:700}
#right{display:flex;align-items:center;gap:12px}
#starRow{display:flex;gap:3px}
.st{width:clamp(24px,4.6vmin,40px);height:auto;overflow:visible;display:block}
.st path{fill:var(--white);stroke:var(--ink);stroke-width:1.8;stroke-linejoin:round}
.st.gold path{fill:var(--sun)}
.st.gold{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
.st.miss path{fill:var(--miss)}
#mute{width:clamp(34px,6vmin,54px);aspect-ratio:1;border-radius:50%;background:var(--white);border:3px solid var(--ink);display:grid;place-items:center;padding:0;box-shadow:0 3px 0 var(--shade)}
#mute svg{width:60%;height:60%}
#mute.off .waves{display:none}
#mute:not(.off) .slash{display:none}

#stage{flex:1;min-height:0;position:relative;overflow:hidden;border-radius:28px;border:4px solid var(--ink);
  background:linear-gradient(var(--wall) 0 56%,var(--counter) 56% 100%)}
#stage::before{content:"";position:absolute;inset:0 0 44% 0;
  background-image:repeating-linear-gradient(90deg,transparent 0 78px,var(--wall-line) 78px 80px),repeating-linear-gradient(0deg,transparent 0 78px,var(--wall-line) 78px 80px)}
#stage::after{content:"";position:absolute;left:0;right:0;top:56%;height:14px;background:var(--counter-edge)}
#lv{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--H)*.05);padding:calc(var(--H)*.04) 14px;box-sizing:border-box}
.row{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:calc(var(--W)*.05)}
#fx{position:absolute;inset:0;z-index:10;pointer-events:none;overflow:hidden}
.fx{position:absolute;left:0;top:0;will-change:transform,opacity}
.fx>svg{display:block;width:100%;height:100%;overflow:visible}
.fx .choice{width:100%;height:100%;box-shadow:none}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .28s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes bob{50%{transform:scale(1.08)}}
.glow{animation:glow .9s ease-in-out infinite}
@keyframes glow{50%{filter:drop-shadow(0 0 8px #fff6b0) drop-shadow(0 0 4px #ffcf3d);transform:scale(1.1)}}
.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-10px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
.cutline{position:absolute;height:5px;border-radius:3px;background:var(--white);box-shadow:0 0 0 2px var(--ink);transform-origin:center;animation:cut .25s ease-out forwards}
@keyframes cut{from{transform:rotate(var(--a)) scaleX(0)}to{transform:rotate(var(--a)) scaleX(1)}}

.round-act{position:absolute;bottom:clamp(8px,2vmin,18px);width:clamp(70px,13vmin,112px);aspect-ratio:1;border-radius:50%;border:5px solid var(--ink);display:grid;place-items:center;padding:0;box-shadow:0 6px 0 var(--shade);z-index:7;transition:transform .2s}
.round-act svg{width:58%;height:58%}
.round-act:active{transform:scale(.92)}
#check{right:clamp(8px,2vmin,18px);background:var(--leaf);animation:bob 1s ease-in-out infinite}
#undo{left:clamp(8px,2vmin,18px);background:var(--white)}

#dock{height:clamp(96px,20vmin,170px);display:flex;align-items:center;justify-content:center;gap:clamp(8px,2.4vmin,24px);padding:10px 0 12px;box-sizing:content-box}
.bowl{width:clamp(56px,14vmin,120px);aspect-ratio:1;border-radius:50%;border:4px solid var(--ink);background:var(--white);display:grid;place-items:center;padding:0;box-shadow:0 5px 0 var(--shade);transition:transform .2s,background .2s}
.bowl svg{width:84%;height:84%}
.bowl.sel{transform:translateY(-12px) scale(1.12);background:var(--sun)}
.choice,.num-btn{width:clamp(64px,15vmin,124px);aspect-ratio:1;border-radius:50%;border:5px solid var(--ink);background:var(--white);font:700 clamp(40px,10vmin,88px)/1 var(--font);color:var(--ink);display:grid;place-items:center;padding:0 0 .12em;box-shadow:0 5px 0 var(--shade);box-sizing:border-box}
.num-btn{background:var(--sun);padding:0 0 .06em}

/* customers */
.cust{aspect-ratio:1;position:relative}
.cust svg.face{width:100%;height:100%;overflow:visible;display:block}
.mouth-open{display:none}
.cust.chew .mouth-open{display:inline}
.cust.chew .smile{display:none}
.cust.chew svg.face{animation:chew .26s ease-in-out 3}
@keyframes chew{50%{transform:scale(1.06,.94)}}
.cust.jump svg.face{animation:jump .5s ease-out 3}
@keyframes jump{40%{transform:translateY(-14%)}}

/* pizza wedges (fair shares, party) */
.w{transition:opacity .25s,transform .45s cubic-bezier(.3,1.4,.5,1)}
.cut .w{transform:translate(var(--gx),var(--gy))}
.w.gone{opacity:0}
.wo{opacity:0;transition:opacity .2s}
.cut .wo{opacity:1}
.cut .ring{opacity:0}

/* L1 shop sign */
.model{display:flex;gap:.25em;background:var(--white);border:4px solid var(--ink);border-radius:14px;padding:.15em .6em;font:700 calc(var(--t)*.5)/1.1 var(--font);box-shadow:0 4px 0 var(--shade);transform:rotate(-2deg)}
.sign{display:flex;gap:calc(var(--t)*.15);padding:calc(var(--t)*.22) calc(var(--t)*.3);background:var(--tomato);border:5px solid var(--ink);border-radius:calc(var(--t)*.3);box-shadow:0 6px 0 var(--shade);transition:background .3s}
.sign.lit{background:var(--sun);animation:bob .6s ease-in-out 3}
.slot{position:relative;width:var(--t);height:var(--t);box-sizing:border-box;border-radius:calc(var(--t)*.18);border:4px dashed rgba(255,253,247,.85);display:grid;place-items:center;font:700 calc(var(--t)*.66)/1 var(--font);color:rgba(255,253,247,.5)}
.sign.lit .slot{border-color:transparent}
.tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:calc(var(--t)*.35);max-width:94%}
.tile{position:relative;z-index:1;width:var(--t);height:var(--t);box-sizing:border-box;border-radius:calc(var(--t)*.18);background:var(--white);border:4px solid var(--ink);display:grid;place-items:center;font:700 calc(var(--t)*.66)/1 var(--font);color:var(--ink);box-shadow:0 5px 0 var(--shade);touch-action:none;cursor:grab}
.tile.drag{z-index:30;box-shadow:0 14px 12px var(--shade);cursor:grabbing}
.slot .tile{position:absolute;inset:-4px;width:auto;height:auto;box-shadow:none;cursor:default}

/* L2 dough balls */
.tray{display:flex;align-items:flex-end;gap:calc(var(--bs)*.12);padding:calc(var(--bs)*.12) calc(var(--bs)*.16);background:linear-gradient(var(--wood1),var(--wood2));border:5px solid var(--ink);border-radius:calc(var(--bs)*.24);box-shadow:0 6px 0 var(--shade)}
.spot{width:var(--bs);height:var(--bs);box-sizing:border-box;border-radius:50%;border:4px dashed rgba(59,33,70,.35);display:flex;align-items:flex-end;justify-content:center}
.legend{width:calc(var(--bs)*1.8);max-width:60%}
.legend svg{width:100%;display:block}
.balls{display:flex;align-items:flex-end;justify-content:center;gap:calc(var(--bs)*.2);min-height:var(--bs)}
.ball{flex:none;width:calc(var(--bs)*var(--k));aspect-ratio:1;padding:0;border:0;background:none;border-radius:50%}
.spot .ball{width:calc((var(--bs) - 8px)*var(--k));cursor:default}
.ball svg{display:block;width:100%;height:100%;overflow:visible}

/* L3 letters */
.l3pz{width:min(calc(var(--H)*.86),calc(var(--W)*.7));aspect-ratio:1}
.l3pz svg,.l4pz svg,.l5pz svg,.l6pz svg,.l9pz svg{width:100%;height:100%;display:block;overflow:visible}
.bigL,.litL{font-family:var(--font);font-weight:700;fill:var(--ink);stroke:var(--white);stroke-width:7px;paint-order:stroke;stroke-linejoin:round;transition:opacity .3s}
.bigL{font-size:104px}
.litL{font-size:76px}

/* L4 order up */
.l4{gap:calc(var(--W)*.04)}
.ticket{position:relative;background:var(--white);border:4px solid var(--ink);border-radius:12px;padding:calc(var(--H)*.045) calc(var(--H)*.035) calc(var(--H)*.03);display:flex;flex-direction:column;gap:calc(var(--H)*.03);box-shadow:0 6px 0 var(--shade);transform:rotate(-3deg)}
.ticket .clip{position:absolute;left:30%;right:30%;top:-14px;height:20px;background:#c9ced6;border:4px solid var(--ink);border-radius:6px}
.line{display:flex;align-items:center;gap:calc(var(--H)*.02)}
.num{font:700 calc(var(--H)*.15)/1 var(--font);min-width:.65em;text-align:center}
.line>svg{width:calc(var(--H)*.11);height:calc(var(--H)*.11)}
.dots{display:grid;grid-template-columns:repeat(3,auto);gap:4px}
.dots i{width:calc(var(--H)*.032);aspect-ratio:1;border-radius:50%;background:var(--ink)}
.l4pz{width:min(calc(var(--H)*.84),calc(var(--W)*.56));aspect-ratio:1;touch-action:none;transition:transform .7s ease-in,opacity .7s}
.l4pz.out{transform:translateX(80vw) rotate(50deg);opacity:0}
.bnum{font-family:var(--font);font-weight:700;font-size:13px;fill:var(--white)}

/* L5 more or fewer */
.l5pz{position:relative;width:min(calc(var(--H)*.6),calc(var(--W)*.4));aspect-ratio:1;border:0;background:none;padding:0;border-radius:50%}
.cnt{position:absolute;left:50%;top:0;z-index:2;transform:translate(-50%,-55%) scale(0);min-width:1.3em;padding:0 .2em;border-radius:999px;background:var(--sun);border:4px solid var(--ink);font:700 calc(var(--H)*.1)/1.25 var(--font);text-align:center;transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.l5pz.show .cnt{transform:translate(-50%,-55%) scale(1)}

/* L6 fair shares */
.table{display:flex;justify-content:center;gap:calc(var(--W)*.03)}
.friend{width:var(--fw);display:flex;flex-direction:column;align-items:center;gap:4px}
.friend .cust{width:90%}
.plate{width:100%;aspect-ratio:1;border-radius:50%;background:var(--white);border:5px solid var(--ink);box-shadow:0 5px 0 var(--shade),inset 0 0 0 calc(var(--fw)*.07) #f1ece1;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:2px;padding:14%;box-sizing:border-box}
.ps{width:30%;aspect-ratio:1}
.plate.many .ps{width:23%}
.ps svg{width:100%;height:100%;display:block}
.l6pz{width:min(calc(var(--H)*.34),calc(var(--W)*.4));aspect-ratio:1}

/* L7 slices left */
.l7c{width:min(calc(var(--H)*.3),calc(var(--W)*.3))}
.board{display:flex;gap:calc(var(--sw)*.08);padding:calc(var(--sw)*.14) calc(var(--sw)*.2);background:linear-gradient(var(--wood1),var(--wood2));border:5px solid var(--ink);border-radius:calc(var(--sw)*.25);box-shadow:0 6px 0 var(--shade)}
.sl{position:relative;width:var(--sw);aspect-ratio:1}
.sl svg{width:100%;height:100%;display:block;overflow:visible}
.badge{position:absolute;right:-6%;top:-8%;width:42%;aspect-ratio:1;border-radius:50%;background:var(--ink);color:var(--white);font:700 calc(var(--sw)*.26)/1 var(--font);display:grid;place-items:center;animation:pop .3s cubic-bezier(.3,1.6,.5,1)}

/* L8 delivery */
#lv.street{background:linear-gradient(var(--sky) 0 16%,var(--grass) 16% 100%);display:grid;grid-template-rows:minmax(0,1fr) auto minmax(0,1fr);gap:0;padding:calc(var(--H)*.03) 12px}
.hrow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:calc(var(--W)*.02);align-items:end;justify-items:center;min-height:0}
.hrow.low{align-items:start}
.house{position:relative;width:min(100%,calc(var(--H)*.29));aspect-ratio:100/110;padding:0;border:0;background:none}
.house>svg{width:100%;height:100%;display:block;overflow:visible}
.hnum{font-family:var(--font);font-weight:700;font-size:23px;fill:var(--ink)}
.hf{position:absolute;left:25%;width:50%;top:-34%;aspect-ratio:1;transform:scale(0);transition:transform .4s cubic-bezier(.3,1.6,.5,1);pointer-events:none}
.hf svg{width:100%;height:100%;display:block;overflow:visible}
.house.home .hf{transform:scale(1)}
.road{position:relative;height:calc(var(--H)*.15);margin:calc(var(--H)*.02) -12px;background:var(--road) repeating-linear-gradient(90deg,var(--white) 0 28px,transparent 28px 56px) 0 50%/100% 6px no-repeat;border-block:5px solid var(--white)}
.scooter{position:absolute;left:0;top:50%;width:calc(var(--H)*.15);aspect-ratio:1.3;transform:translate(0,-50%)}
.scooter svg{width:100%;height:100%;display:block;overflow:visible;transition:transform .2s}
.pbox{height:100%;aspect-ratio:1.2}
.pbox svg{width:100%;height:100%;display:block}
.boxn{font-family:var(--font);font-weight:700;font-size:44px;fill:var(--ink)}

/* L9 party */
.l9c{width:min(calc(var(--H)*.28),calc(var(--W)*.3))}
.l9pz{width:min(calc(var(--H)*.6),calc(var(--W)*.6));aspect-ratio:1;cursor:pointer}

/* level done */
#done{position:absolute;inset:0;z-index:9;background:rgba(127,211,198,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4vmin}
#done .big{display:flex;gap:2vmin;flex-wrap:wrap;justify-content:center;padding:0 16px}
#done .big .st{width:clamp(50px,12vmin,110px);animation:pop .5s cubic-bezier(.3,1.6,.5,1) backwards}
#done .big .st:nth-child(2){animation-delay:.12s}
#done .big .st:nth-child(3){animation-delay:.24s}
#done .big .st:nth-child(4){animation-delay:.36s}
#done .big .st:nth-child(5){animation-delay:.48s}
#done .big .st:nth-child(6){animation-delay:.6s}
.donePz{width:min(40vmin,260px);aspect-ratio:1;animation:bob 1.6s ease-in-out infinite}
.donePz svg{width:100%;height:100%;display:block}
#next{width:clamp(100px,20vmin,170px);aspect-ratio:1;border-radius:50%;background:var(--leaf);border:6px solid var(--ink);display:grid;place-items:center;padding:0;box-shadow:0 8px 0 var(--shade);animation:bob 1.1s ease-in-out infinite}
#next svg{width:55%;height:55%}

#intro{position:fixed;inset:0;z-index:50;background:var(--wall);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vmin;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  transition:opacity .5s,visibility .5s}
#intro.gone{opacity:0;visibility:hidden}
#intro h1{margin:0;font-size:clamp(44px,12vmin,120px);line-height:1;text-wrap:balance;text-shadow:0 5px 0 var(--white)}
#intro .art{width:min(52vmin,340px);animation:bob 2s ease-in-out infinite}
#play{width:clamp(110px,22vmin,200px);aspect-ratio:1;border-radius:50%;background:var(--sun);border:6px solid var(--ink);display:grid;place-items:center;padding:0;box-shadow:0 8px 0 var(--shade);animation:bob 1.2s ease-in-out infinite}
#play svg{width:50%;height:50%;margin-left:8%}
@media (prefers-reduced-motion:reduce){#check,#intro .art,#play,#next,.donePz,.glow{animation:none}}
</style>
</head>
<body>
<div id="intro">
  <svg class="art" viewBox="-100 -100 200 200" aria-hidden="true">
    <circle r="88" fill="#c98743" stroke="#3b2146" stroke-width="4"/>
    <circle r="80" fill="#e6ad5e" stroke="#3b2146" stroke-width="3"/>
    <circle r="70" fill="#d6342a"/>
    <g fill="#ffd54a"><rect x="-40" y="-52" width="22" height="6" rx="3" transform="rotate(20 -40 -52)"/><rect x="10" y="-58" width="22" height="6" rx="3" transform="rotate(-30)"/><rect x="30" y="20" width="22" height="6" rx="3" transform="rotate(50 30 20)"/><rect x="-55" y="12" width="22" height="6" rx="3" transform="rotate(-15 -55 12)"/><rect x="-10" y="45" width="22" height="6" rx="3"/><rect x="-14" y="-8" width="22" height="6" rx="3" transform="rotate(35)"/></g>
    <g fill="#c8372d" stroke="#8e2119" stroke-width="2"><circle cx="-30" cy="-22" r="13"/><circle cx="26" cy="-30" r="13"/><circle cx="34" cy="26" r="13"/><circle cx="-24" cy="30" r="13"/><circle cx="2" cy="0" r="13"/></g>
    <g fill="#4cb050" stroke="#2d7a38" stroke-width="2"><path d="M-48,0 Q-40,-10 -32,0 Q-40,10 -48,0Z"/><path d="M52,-4 Q60,-14 68,-4 Q60,6 52,-4Z" transform="scale(.7) translate(10 10)"/></g>
  </svg>
  <h1>Pizza Day</h1>
  <button id="play" aria-label="Play"><svg viewBox="0 0 24 24"><path d="M5 3 L21 12 L5 21 Z" fill="#fffdf7" stroke="#3b2146" stroke-width="2.4" stroke-linejoin="round"/></svg></button>
</div>

<div id="app">
  <div id="top">
    <div id="steps"></div>
    <div id="right">
      <div id="starRow"></div>
      <button id="mute" aria-label="Sound on or off"><svg viewBox="0 0 24 24" fill="none" stroke="#3b2146" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9 H8 L13 5 V19 L8 15 H4 Z" fill="#ffcf3d"/><path class="waves" d="M16 9 Q18.5 12 16 15 M18.5 6.5 Q23 12 18.5 17.5"/><path class="slash" d="M17 8 L22 16 M22 8 L17 16"/></svg></button>
    </div>
  </div>

  <div id="stage">
    <div id="lv"></div>
    <button id="undo" class="round-act" aria-label="Take one off" hidden><svg viewBox="0 0 24 24" fill="none" stroke="#3b2146" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6 L4 11 L9 16"/><path d="M4 11 H15 A5 5 0 0 1 15 21 H11"/></svg></button>
    <button id="check" class="round-act" aria-label="Done" hidden><svg viewBox="0 0 24 24" fill="none" stroke="#fffdf7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5 L10 18 L20 6"/></svg></button>
    <div id="done" hidden><div class="big"></div><button id="next" aria-label="Next"></button></div>
    <div id="fx"></div>
  </div>

  <div id="dock"></div>
</div>

<script>
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const NS = 'http://www.w3.org/2000/svg';
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

    shuffle([...opts]).forEach(v => {
      const b = el('button', 'num-btn', String(v)); b.dataset.v = v;
      b.addEventListener('click', async () => {
        if (done) return; done = true; ac();
        const good = [...dock.children].find(x => +x.dataset.v === ans), left = sl.filter(s => !s.classList.contains('eaten'));
        good.classList.add('glow');
        if (v === ans) {
          S.ding(); earn(r, true);
          for (let i = 0; i < left.length; i++) { left[i].append(el('span', 'badge', String(i + 1))); S.count(i); await wait(160); }
          await say(`Yes! ${N} take away ${k} is ${ans}.`); if (!alive(tok)) return;
        } else {
          S.oops(); b.classList.add('shake'); earn(r, false);
          await say("Let's count them."); if (!alive(tok)) return;
          for (let i = 0; i < left.length; i++) { left[i].append(el('span', 'badge', String(i + 1))); S.count(i); await say(String(i + 1)); if (!alive(tok)) return; }
          await say(`${ans} slices are left. ${N} take away ${k} is ${ans}.`); if (!alive(tok)) return;
        }
        await wait(600); if (!alive(tok)) return;
        r++; r < RD.length ? round() : levelDone(tok);
      });
      dock.append(b);
    });
    await say('How many slices are left?');
  }
  round();
} });

/* ---------- Level 8: delivery to house numbers (1 to 10, then 11 to 20) ---------- */
const HOUSE_COL = [['#ff8fc2', '#9a5ce0'], ['#ffd23f', '#e5483b'], ['#6fb7ff', '#3b5bd6'], ['#8fe08a', '#2d7a38'], ['#ffb36b', '#b5784a']];
const houseSVG = (n, i) => { const [wall, roof] = HOUSE_COL[i % 5]; return `<svg viewBox="0 0 100 110"><rect x="12" y="42" width="76" height="64" rx="4" fill="${wall}" stroke="#3b2146" stroke-width="4"/><path d="M4 46 L50 8 L96 46 Z" fill="${roof}" stroke="#3b2146" stroke-width="4" stroke-linejoin="round"/><circle cx="50" cy="62" r="17" fill="#fffdf7" stroke="#3b2146" stroke-width="3.5"/><text class="hnum" x="50" y="70" text-anchor="middle">${n}</text><rect x="41" y="82" width="18" height="24" rx="3" fill="#3b2146"/><rect x="18" y="52" width="12" height="12" rx="2" fill="#bfe9ff" stroke="#3b2146" stroke-width="2.5"/><rect x="70" y="52" width="12" height="12" rx="2" fill="#bfe9ff" stroke="#3b2146" stroke-width="2.5"/></svg>`; };
const SCOOTER = '<svg viewBox="0 0 130 100"><rect x="18" y="20" width="46" height="32" rx="4" fill="#fffdf7" stroke="#3b2146" stroke-width="4"/><circle cx="41" cy="36" r="9" fill="#e5483b"/><path d="M14 74 Q14 54 38 54 H86 L102 74 Z" fill="#e5483b" stroke="#3b2146" stroke-width="4" stroke-linejoin="round"/><path d="M96 70 L108 30 H120" stroke="#3b2146" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="28" cy="80" r="15" fill="#3b2146"/><circle cx="28" cy="80" r="6" fill="#c9ced6"/><circle cx="104" cy="80" r="15" fill="#3b2146"/><circle cx="104" cy="80" r="6" fill="#c9ced6"/></svg>';
const BOX = n => `<svg viewBox="0 0 120 100"><rect x="8" y="20" width="104" height="72" rx="6" fill="#fffdf7" stroke="#3b2146" stroke-width="5"/><rect x="8" y="20" width="104" height="17" rx="6" fill="#e5483b" stroke="#3b2146" stroke-width="5"/><text class="boxn" x="60" y="81" text-anchor="middle">${n}</text></svg>`;
LV.push({ icon: ICON[7], n: 6, start(tok) {
  const T = [3, 8, 6, 15, 12, 18]; let r = 0, houses = [], road, scooter, sx = 0, done = true;
  function street(b) {
    lv.innerHTML = ''; lv.className = 'street'; houses = []; sx = 0;
    const r1 = el('div', 'hrow'), r2 = el('div', 'hrow low'); road = el('div', 'road');
    for (let i = 0; i < 10; i++) {
      const n = b + i, h = el('button', 'house', houseSVG(n, i) + '<div class="hf"></div>');
      h.dataset.n = n; h.setAttribute('aria-label', 'House ' + n); h.addEventListener('click', () => pickHouse(h));
      (i < 5 ? r1 : r2).append(h); houses.push(h);
    }
    scooter = el('div', 'scooter', SCOOTER); road.append(scooter);
    lv.append(r1, road, r2);
  }
  async function drive(h) {
    const rr = road.getBoundingClientRect(), hr = h.getBoundingClientRect(), sw = scooter.getBoundingClientRect().width;
    const tx = Math.max(0, Math.min(rr.width - sw, hr.left + hr.width / 2 - rr.left - sw / 2));
    scooter.firstElementChild.style.transform = tx < sx ? 'scaleX(-1)' : '';
    S.whoosh();
    const an = scooter.animate([{ transform: `translate(${sx}px,-50%)` }, { transform: `translate(${tx}px,-50%)` }], { duration: Math.min(1500, 450 + Math.abs(tx - sx) * 1.3), easing: 'ease-in-out', fill: 'forwards' });
    await new Promise(res => { an.onfinish = res; });
    sx = tx; scooter.style.transform = `translate(${tx}px,-50%)`; an.cancel();
  }
  async function pickHouse(h) {
    if (done) return; done = true; ac();
    const n = T[r], good = houses.find(x => +x.dataset.n === n);
    if (h === good) { S.pop(); earn(r, true); }
    else {
      S.oops(); h.classList.add('shake'); earn(r, false);
      await say(`That is house ${h.dataset.n}.`); if (!alive(tok)) return;
      h.classList.remove('shake'); good.classList.add('glow');
      await say(`This is house ${n}.`); if (!alive(tok)) return;
    }
    await drive(good); if (!alive(tok)) return;
    good.classList.remove('glow'); S.dingdong(); await wait(600); if (!alive(tok)) return;
    const c = pick(CUST); good.querySelector('.hf').innerHTML = custSVG(c); good.classList.add('home');
    const m = rel(good); hearts(m.x + m.w / 2, m.y, 4);
    await say(`Pizza for ${c.nm}! Thank you!`); if (!alive(tok)) return;
    await wait(400); if (!alive(tok)) return;
    good.classList.remove('home'); r++;
    if (r >= T.length) return levelDone(tok);
    if (r === 3) { street(11); dock.innerHTML = ''; await say('Now a new street, with bigger numbers!'); if (!alive(tok)) return; }
    ask();
  }
  function ask() { done = false; dock.innerHTML = ''; dock.append(el('div', 'pbox', BOX(T[r]))); say(`Take the pizza to house number ${T[r]}.`); }
  street(1); dock.append(el('div', 'pbox', BOX(T[0])));
  (async () => { await say('Time to deliver the pizzas!'); if (!alive(tok)) return; ask(); })();
} });

/* ---------- Level 9: pizza party (cut and feed) ---------- */
LV.push({ icon: ICON[8], n: 0, start(tok) {
  const c = pick(CUST), tt = shuffle([0, 1, 2, 3, 4, 5]).slice(0, 2);
  const face = el('div', 'cust l9c', custSVG(c)), pw = el('div', 'l9pz', `<svg viewBox="-100 -100 200 200">${wedgesSVG(8, tt)}</svg>`);
  lv.append(face, pw);
  let cut = false, cutting = false, eaten = 0;
  pw.addEventListener('pointerdown', async e => {
    ac(); e.preventDefault();
    if (!cut) {
      if (cutting) return; cutting = true;
      const p = rel(pw), d = p.w;
      for (let i = 0; i < 4; i++) {
        S.cut(); const l = el('div', 'cutline'); l.style.cssText = `left:${p.x}px;top:${p.y + d / 2 - 2.5}px;width:${d}px;--a:${i * 45}deg`; fxEl.append(l);
        await wait(170); if (!alive(tok)) return;
      }
      await wait(250); if (!alive(tok)) return;
      fxEl.querySelectorAll('.cutline').forEach(l => l.remove()); pw.classList.add('cut'); cut = true;
      say(`Tap a slice to feed ${c.nm}!`); return;
    }
    const w = e.target.closest('.w'); if (!w || w.classList.contains('gone')) return;
    w.classList.add('gone'); await feed(face, rel(w)); if (!alive(tok)) return;
    if (++eaten === 8) { face.classList.add('jump'); await say('Yum! All gone!'); levelDone(tok, true); }
  });
  say(`Pizza party! ${c.nm} is hungry. Tap the pizza to cut it.`);
} });

/* ---------- boot ---------- */
LV.forEach((L, i) => {
  const b = el('button', 'dot', L.icon); b.setAttribute('aria-label', 'Level ' + (i + 1));
  let t; b.addEventListener('pointerdown', () => { t = setTimeout(() => { ac(); startLevel(i); }, 700); });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => b.addEventListener(ev, () => clearTimeout(t)));
  stepsEl.appendChild(b);
});
$('#mute').addEventListener('click', e => {
  muted = !muted; e.currentTarget.classList.toggle('off', muted);
  if (muted && 'speechSynthesis' in window) speechSynthesis.cancel();
});
new ResizeObserver(layout).observe(stage); window.addEventListener('resize', layout); layout();
$('#play').addEventListener('click', () => { ac(); $('#intro').classList.add('gone'); startLevel(0); });
</script>
</body>
