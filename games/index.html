<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Games</title>
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Games">
<meta name="theme-color" content="#7fd3c6">
<style>
:root{--bg:#fff8ec;--ink:#3b2146;--card:#fffdf7;--shade:rgba(59,33,70,.15);color-scheme:light}
*{box-sizing:border-box}
body{margin:0;padding:max(20px,env(safe-area-inset-top)) 16px 40px;background:var(--bg);color:var(--ink);font-family:ui-rounded,'Arial Rounded MT Bold',system-ui,sans-serif}
main{max-width:760px;margin:0 auto}
h1{font-size:2rem;margin:.4em 0 .1em}
p.sub{margin:0 0 1.2em;opacity:.7}
h2{font-size:1.1rem;margin:1.6em 0 .6em;opacity:.7;text-transform:uppercase;letter-spacing:.06em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
a.g{display:flex;align-items:center;gap:12px;padding:16px;border-radius:18px;background:var(--card);color:inherit;text-decoration:none;box-shadow:0 3px 0 var(--shade);font-weight:700;font-size:1.1rem}
a.g:active{transform:translateY(2px);box-shadow:none}
a.g span.e{font-size:2rem}
a.g small{display:block;font-weight:400;font-size:.8rem;opacity:.65}
</style>
</head>
<body>
<main>
<h1>Games</h1>
<p class="sub">Diya and Rohini's games. Add this page to the home screen for one-tap access.</p>

<h2>Kids' games</h2>
<div class="grid">
<a class="g" href="/trick-or-treat/"><span class="e">🎃</span><div>Trick or Treat<small>newest</small></div></a>
<a class="g" href="/pizza-day/"><span class="e">🍕</span><div>Pizza Day</div></a>
<a class="g" href="/cabin-day/"><span class="e">🍂</span><div>Cabin Day</div></a>
<a class="g" href="/space-trip/"><span class="e">🚀</span><div>Space Trip</div></a>
<a class="g" href="/garden-day/"><span class="e">🥕</span><div>Garden Day</div></a>
<a class="g" href="/zoo-day/"><span class="e">🦒</span><div>Zoo Day</div></a>
<a class="g" href="/beach-day/"><span class="e">🏖️</span><div>Beach Day</div></a>
<a class="g" href="https://claude.ai/artifact/HsPBJaF3oP24TquXPnz3P3"><span class="e">🎈</span><div>Party Day<small>opens on claude.ai</small></div></a>
</div>

<h2>Other</h2>
<div class="grid">
<a class="g" href="/worldcup-game/"><span class="e">⚽</span><div>World Cup Portfolio Game</div></a>
</div>
</main>
</body>
</html>
